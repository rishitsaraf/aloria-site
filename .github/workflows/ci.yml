name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aloria
          POSTGRES_DB: aloria
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U aloria"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium (same version as playwright-core)
        run: npx playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - name: Run all suites (API smoke → storefront → CMS audit)
        run: bash scripts/run-tests.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/shots
          if-no-files-found: ignore
