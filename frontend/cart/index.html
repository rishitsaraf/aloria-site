<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — ALORIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
</head>
<body>

<main class="store-main">
  <div class="store-head">
    <div>
      <div class="eyebrow">Your selection</div>
      <h1>Bag</h1>
    </div>
    <div class="count" id="bagCount"></div>
  </div>

  <div class="cart-layout" id="cartLayout" hidden>
    <div id="cartLines"></div>
    <aside class="summary">
      <h2 class="serif">Summary</h2>
      <div class="ship-note" id="shipNote"></div>
      <div class="ship-meter"><i id="shipMeter" style="width:0%"></i></div>
      <div class="sum-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
      <div class="sum-row"><span>Shipping</span><span>Calculated at checkout</span></div>
      <div class="sum-row total"><span>Total</span><span id="sumTotal"></span></div>
      <a class="btn wide gold" style="margin-top:1.2rem" href="/checkout">Checkout</a>
      <div class="field" style="margin-top:1.4rem">
        <label for="saveEmail">Save your bag — we'll keep it safe</label>
        <div class="discount-row" style="margin:0">
          <input id="saveEmail" type="email" placeholder="your@email.com" style="text-transform:none;letter-spacing:0">
          <button class="btn ghost small" id="saveEmailBtn" type="button">Save</button>
        </div>
        <div class="form-msg" id="saveMsg"></div>
      </div>
    </aside>
  </div>

  <div class="empty-state" id="cartEmpty" hidden>
    <div class="big">Your bag is empty</div>
    <p>Every stack starts with one piece.</p>
    <p style="margin-top:1.4rem"><a class="btn ghost" href="/shop">Explore the collection</a></p>
  </div>
</main>

<script src="/js/store.js"></script>
<script src="/js/cart-page.js"></script>
</body>
</html>
