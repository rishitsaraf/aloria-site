<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Returns — ALORIA</title>
<meta name="description" content="Start a return for your Aloria order — look it up with your order number and email.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
</head>
<body>

<main class="store-main">
  <div class="contact-wrap">
    <div class="eyebrow">The atelier</div>
    <h1 class="serif">Returns</h1>
    <p class="lede">Changed your mind? Look up your order and we'll arrange the return — refunds go back to your original payment method once the pieces reach us.</p>

    <form class="contact-form" id="rmaLookup" novalidate>
      <label>Order number<input id="rlNumber" placeholder="ALR-1001" maxlength="20" required></label>
      <label>Email on the order<input id="rlEmail" type="email" maxlength="254" required autocomplete="email"></label>
      <div><button class="btn" type="submit" id="rlGo">Find my order</button></div>
      <div class="form-msg" id="rlMsg" aria-live="polite"></div>
    </form>

    <div id="rmaOrder" hidden>
      <h2 class="serif" style="margin:1.8rem 0 0.6rem">Order <span id="roNumber"></span></h2>
      <div id="roExisting"></div>
      <form id="rmaForm" novalidate>
        <div id="roItems" class="ro-items" role="group" aria-label="Pieces to return"></div>
        <label class="contact-form" style="display:grid;gap:0.3rem;margin-top:0.9rem;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft)">Why are they coming back?
          <textarea id="roReason" rows="3" maxlength="1000" required style="border:1px solid var(--line);padding:0.7rem 0.9rem;font-family:var(--sans);font-size:16px;background:var(--white);outline:none"></textarea>
        </label>
        <div style="margin-top:0.9rem"><button class="btn" type="submit" id="roSubmit">Request return</button></div>
        <div class="form-msg" id="roMsg" aria-live="polite"></div>
      </form>
    </div>
  </div>
</main>

<script src="/js/store.js"></script>
<script>
  Store.nav("");
  Store.footer();
  let currentLookup = null;

  const STATUS_HELP = {
    requested: "Requested — we're reviewing it",
    approved: "Approved — post the pieces back with the RMA number",
    rejected: "Not approved",
    received: "Received at the atelier",
    refunded: "Refunded",
  };

  document.getElementById("rmaLookup").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("rlMsg");
    msg.textContent = "";
    try {
      const number = document.getElementById("rlNumber").value.trim();
      const email = document.getElementById("rlEmail").value.trim();
      const data = await Store.api(`returns/eligible?number=${encodeURIComponent(number)}&email=${encodeURIComponent(email)}`);
      currentLookup = { number, email };
      document.getElementById("rmaOrder").hidden = false;
      document.getElementById("roNumber").textContent = data.order.number;
      document.getElementById("roExisting").innerHTML = data.returns.map((r) =>
        `<div class="rma-status"><b>${Store.esc(r.rma)}</b> · ${Store.esc(STATUS_HELP[r.status] || r.status)}</div>`).join("");
      const form = document.getElementById("rmaForm");
      form.hidden = !data.eligible;
      if (!data.eligible) {
        msg.className = "form-msg";
        msg.textContent = data.windowError || (data.returns.length ? "A return is already in progress for this order." : "");
        return;
      }
      document.getElementById("roItems").innerHTML = data.items.map((i, n) => `
        <label class="ro-item">
          <input type="checkbox" data-ret-sku="${Store.esc(i.sku)}">
          <span>${Store.esc(i.title)}${i.label ? ` — ${Store.esc(i.label)}` : ""}</span>
          <input type="number" min="1" max="${i.qty}" value="${i.qty}" data-ret-qty="${Store.esc(i.sku)}" aria-label="Quantity to return">
        </label>`).join("");
    } catch (err) {
      msg.className = "form-msg err";
      msg.textContent = err.message;
      document.getElementById("rmaOrder").hidden = true;
    }
  });

  document.getElementById("rmaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("roMsg");
    const items = [...document.querySelectorAll("[data-ret-sku]:checked")].map((cb) => ({
      sku: cb.dataset.retSku,
      qty: parseInt(document.querySelector(`[data-ret-qty="${CSS.escape(cb.dataset.retSku)}"]`).value, 10) || 1,
    }));
    try {
      const r = await Store.api("returns", { method: "POST", body: {
        orderNumber: currentLookup.number,
        email: currentLookup.email,
        items,
        reason: document.getElementById("roReason").value,
      } });
      msg.className = "form-msg ok";
      msg.textContent = `Return ${r.rma} requested — instructions are on their way to your email.`;
      document.getElementById("rmaForm").hidden = true;
      document.getElementById("roExisting").innerHTML =
        `<div class="rma-status"><b>${Store.esc(r.rma)}</b> · ${STATUS_HELP.requested}</div>` +
        document.getElementById("roExisting").innerHTML;
    } catch (err) {
      msg.className = "form-msg err";
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
