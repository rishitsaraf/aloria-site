<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — ALORIA</title>
<meta name="description" content="Stackable, customisable fine jewellery — ear stacks, layered necklaces and ring stacks in 925 silver with gold and rhodium plating.">
<meta property="og:title" content="ALORIA — Stackable, customisable jewellery">
<meta property="og:description" content="Ear stacks, layered necklaces and ring stacks. Two platings, five stone shapes, four stone colors — build a stack that's yours.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
</head>
<body>

<main class="store-main">
  <!-- landing extras (hidden when filtering/searching) -->
  <div id="landing" hidden>
    <section class="shop-hero">
      <img src="/assets/img/worn/neck/neck_worn_01.webp" alt="Layered Aloria necklaces worn">
      <div class="veil"></div>
      <div class="hero-inner">
        <h2 class="serif">Build a stack that's <em>yours</em>.</h2>
        <p>Two platings · Five shapes · Four stones</p>
      </div>
    </section>
    <div class="cat-tiles">
      <a class="cat-tile" href="/shop?category=ear">
        <img src="/assets/img/worn/ear/ear_worn_02.webp" alt="Ear stack" loading="lazy">
        <span class="ct-num serif">01</span><span class="ct-label">Ear</span>
      </a>
      <a class="cat-tile" href="/shop?category=neck">
        <img src="/assets/img/worn/neck/neck_worn_03.webp" alt="Layered necklaces" loading="lazy">
        <span class="ct-num serif">02</span><span class="ct-label">Neck</span>
      </a>
      <a class="cat-tile" href="/shop?category=rings">
        <img src="/assets/img/worn/rings/rings_worn_01.webp" alt="Ring stack" loading="lazy">
        <span class="ct-num serif">03</span><span class="ct-label">Rings</span>
      </a>
    </div>
    <div class="section-row">
      <h2 class="serif">Signature pieces</h2>
    </div>
  </div>

  <div class="store-head" id="browseHead">
    <div>
      <div class="eyebrow" id="shopEyebrow">The collection</div>
      <h1 id="shopTitle">Shop</h1>
    </div>
    <form class="shop-search" id="searchForm">
      <input id="searchInput" type="search" placeholder="Search pieces…" aria-label="Search products">
    </form>
    <div class="count" id="shopCount"></div>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-btn" data-cat="">All</button>
    <button class="filter-btn" data-cat="ear">Ear</button>
    <button class="filter-btn" data-cat="neck">Neck</button>
    <button class="filter-btn" data-cat="rings">Rings</button>
  </div>

  <div class="product-grid" id="grid"></div>
  <div class="load-more-wrap"><button class="btn ghost" id="loadMore" hidden>Load more</button></div>
  <div class="empty-state" id="emptyState" hidden>
    <div class="big">Nothing here yet</div>
    <p>The catalog is being polished — check back soon.</p>
  </div>
</main>

<script src="/js/store.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
