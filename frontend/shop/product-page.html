<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALORIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
</head>
<body>

<main class="store-main">
  <nav class="crumbs" id="crumbs" hidden aria-label="Breadcrumb"></nav>
  <div id="pdp" class="pdp" hidden>
    <div class="pdp-gallery">
      <div class="main" id="mainWrap"><img id="mainImg" alt="" fetchpriority="high" decoding="async"></div>
      <div class="pdp-thumbs" id="thumbs"></div>
      <div class="pdp-video" id="pdpVideo" hidden>
        <div class="eyebrow">Worn &amp; moving</div>
        <video id="pdpVideoEl" controls playsinline preload="metadata"></video>
      </div>
    </div>
    <div class="pdp-info">
      <div class="eyebrow" id="pCat"></div>
      <div class="title-row">
        <h1 id="pTitle"></h1>
        <button id="wishBtn" class="wish-btn" type="button" aria-pressed="false" aria-label="Save to wishlist">♡</button>
      </div>
      <div class="sub" id="pSub"></div>
      <div class="pdp-price"><span id="pPrice"></span><span class="compare" id="pCompare"></span></div>
      <p class="pdp-desc" id="pDesc"></p>
      <div id="optGroups"></div>
      <div class="stock-note" id="stockNote" aria-live="polite"></div>
      <div class="stock-alert" id="alertBox" hidden>
        <div class="mono-note">Sold out — we can email you the moment it returns.</div>
        <div class="alert-form">
          <input id="alertEmail" type="email" maxlength="254" placeholder="you@email.com" aria-label="Email for restock alert">
          <button class="btn ghost" id="alertBtn" type="button">Notify me</button>
        </div>
        <span class="form-msg" id="alertMsg" aria-live="polite"></span>
      </div>
      <div class="qty-row">
        <div class="qty-box">
          <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
          <input id="qtyInput" value="1" inputmode="numeric" aria-label="Quantity">
          <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
        </div>
        <button class="btn" id="addBtn" disabled>Select options</button>
      </div>
      <div class="form-msg" id="pdpMsg" aria-live="polite"></div>
      <ul class="trust-strip" aria-label="Why shop with Aloria">
        <li>◈ 925 sterling silver · hypoallergenic</li>
        <li id="trustShip" hidden></li>
        <li>◈ Secure checkout · 30-day returns</li>
      </ul>
    </div>
  </div>
  <div class="empty-state" id="pdpEmpty" hidden>
    <div class="big">This piece slipped away</div>
    <p><a href="/shop">Back to the collection</a></p>
  </div>

  <section class="reviews" id="reviews" hidden aria-label="Customer reviews">
    <div class="section-row">
      <h2 class="serif">Reviews</h2>
      <button type="button" class="btn ghost" id="revWriteBtn">Write a review</button>
    </div>
    <div class="rev-summary" id="revSummary" hidden>
      <div class="rev-score">
        <div class="big" id="revAvg"></div>
        <div class="stars" id="revStars" aria-hidden="true"></div>
        <div class="muted" id="revCount"></div>
      </div>
      <div class="rev-bars" id="revBars"></div>
    </div>
    <form id="revForm" hidden novalidate>
      <div class="rev-form-grid">
        <label>Rating
          <select id="revRating" required aria-label="Rating">
            <option value="5">★★★★★ — Love it</option>
            <option value="4">★★★★ — Like it</option>
            <option value="3">★★★ — It's okay</option>
            <option value="2">★★ — Not great</option>
            <option value="1">★ — Disappointed</option>
          </select>
        </label>
        <label>Name<input id="revName" maxlength="80" required></label>
        <label id="revEmailWrap">Email<input id="revEmail" type="email" maxlength="254"></label>
        <label class="wide">Title<input id="revTitle" maxlength="120" placeholder="Sums it up"></label>
        <label class="wide">Review<textarea id="revBody" rows="4" maxlength="2000" required></textarea></label>
      </div>
      <div class="rev-form-foot">
        <button class="btn" type="submit" id="revSubmit">Submit review</button>
        <span class="form-msg" id="revMsg" aria-live="polite"></span>
      </div>
    </form>
    <div id="revList"></div>
    <div class="muted" id="revEmpty" hidden>No reviews yet — be the first to write one.</div>
  </section>

  <section class="related" id="related" hidden>
    <div class="section-row">
      <h2 class="serif">Complete the stack</h2>
      <a href="/shop" id="relatedMore">View all →</a>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</main>

<script src="/js/store.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
