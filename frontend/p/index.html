<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALORIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
</head>
<body>

<main class="store-main">
  <div id="pageWrap" hidden>
    <div class="eyebrow">Aloria</div>
    <h1 class="serif" id="pageTitle" style="font-size:clamp(2rem,5vw,3rem);margin-bottom:1.4rem"></h1>
    <div class="page-body" id="pageBody"></div>
  </div>
  <div class="empty-state" id="pageEmpty" hidden>
    <div class="big">Page not found</div>
    <p><a href="/shop">Back to the collection</a></p>
  </div>
</main>

<script src="/js/store.js"></script>
<script>
(async () => {
  Store.nav("");
  Store.footer();
  const slug = Store.qs("slug");
  try {
    if (!slug) throw new Error("no slug");
    const { page } = await Store.api(`pages/${encodeURIComponent(slug)}`);
    document.title = `${page.title} — ALORIA`;
    document.getElementById("pageTitle").textContent = page.title;
    document.getElementById("pageBody").innerHTML = Store.mdToHtml(page.body);
    document.getElementById("pageWrap").hidden = false;
  } catch (_) {
    document.getElementById("pageEmpty").hidden = false;
  }
})();
</script>
</body>
</html>
